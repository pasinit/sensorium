# Enforcing mypy config — owned by the dotfiles kit, vendored to .claude/mypy.ini.
# `make typecheck` runs `mypy --config-file .claude/mypy.ini` so strict typing is
# enforced consistently across projects.
[mypy]
strict = true
python_version = 3.13
ignore_missing_imports = true
exclude = (?x)(^\.venv/|/\.venv/|^build/|/build/|^dist/|/dist/)

# --- project overrides (re-apply after re-installing the dotfiles kit) ---
# Simulators and their deps ship without type information.
[mypy-metadrive.*,gym_pybullet_drones.*,robopianist.*,zarr.*,imageio_ffmpeg.*,pyarrow.*]
ignore_missing_imports = True

# torch modules return Any from calls to submodules; every other strict check stays on.
[mypy-sensorium.model.*]
warn_return_any = False
