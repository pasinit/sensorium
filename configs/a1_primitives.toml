# D0.3 step 2: the primitive babbling at two table heights (A1 statistics). 10 episodes of
# 600 steps (30 s) per variant, CPU only; report with
#   uv run python scripts/a1_report.py data/a1_primitives
out_dir = "data/a1_primitives"
master_seed = 0

[humanoid.t072_hand]
policies = ["seated_babble"]
episodes_per_policy = 10
steps = 600
settings = { effector = "hand", posture = "seated", table_top = 0.72 }

