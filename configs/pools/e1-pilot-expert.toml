# The E1 pilot's expert stand-in pool (Track B, docs/model.md "E1 pilot, Track B: pre-registration"):
# the scripted experiment programs of configs/e1_programs.toml (code 077d317, as event_dense), the
# same size and balance as configs/pools/e1-pilot-babble.toml: 2 x 522 training episodes of 600 steps
# (626,400 steps, 1,044 episodes, so the arms' 43,800 steps are 10 epochs of either pool), hands and
# pincers 1:1 by steps, and 5% of each effector's episodes held out first.
#
#   uv run sensorium-index data/pools/e1-pilot-expert.parquet data/e1_programs/manifest.json
#   uv run sensorium-pool data/pools/e1-pilot-expert.parquet configs/pools/e1-pilot-expert.toml \
#       data/pools/e1-pilot-expert.json --heldout-dir data/pools/e1-pilot-expert-heldout
name = "e1-pilot-expert"
total_steps = 626_400        # 2 x 522 episodes x 600 steps, as the babbling pool
senses = ["rgb", "audio_logmel", "proprio", "touch", "action"]  # the arms choose theirs (model.senses)
seed = 0
n_sources = "all"
split = "pretrain"
tolerance = 0.001            # whole episodes: each effector takes exactly 522
heldout_fraction = 0.05

[kinds]
experiment = 1               # the programs' kind (configs/sources.toml [policy_kinds])

[effector_ratio]
hand = 1
pincer = 1
