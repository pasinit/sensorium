# Frozen split file, v3. Fixed before any training; pools only draw from the
# section named by their spec's `split` (normally "pretrain"), and neither a
# held-out task nor a held-out instance may appear in a pool
# (sensorium.pool.validate_pool).
#
# Changelog:
#   v3.3 (2026-11-05): T3b, place on target, carries T1's 4 cm block (the new prop place_block), not
#      the 7 cm wood box: alone, in T1's start region on the disc's side, 10 cm or more from the disc.
#      Its check at v3.2 was 3/30 (no plan for the wood box at the reach edge in 17, slips in the
#      pads in 9 of the 13 grasps, 2 drags onto the disc). A drag no longer counts.
#      T2, open the drawer: each cabinet's pose is drawn per episode (front x 0.38-0.54, |y|
#      0.26-0.33, yaw +-15 deg, inner edge 19 cm or more from the midline), and the demonstrator
#      pulls along the drawer's slide. At v3.2 the cabinets were fixed, and a successful
#      demonstration replayed open loop from another start state opened the drawer in 19 of 21.
#   v3.2 (2026-11-05): adds the held-out task T3b, place on target (pincers): its demonstrator picks an
#      object that began 17 cm or more from the target disc and sets it down on it (the v3.1 layout).
#      It replaces T3 push to target in the E1 pilot, whose demonstrators stayed under the agreed 30%
#      success (hands 6/30, pincers 0/30); the push sources stay held out under their own names.
#   v3.1 (2026-11-05): same sources and sections; T3's layout fixed before any of its demonstrations:
#      the target disc is drawn at x 0.47-0.52, |y| 0.11-0.14 (was 0.50-0.56, 0.12-0.17) and the object
#      that starts 17 cm or more from it at x 0.38-0.52 (was 0.38-0.56), |y| 0.12-0.30 (unchanged)
#      (h1_props.TARGET_X/Y, FAR_OBJECT_X/Y): inside both effectors' reach and the head camera's view,
#      and the 17 cm start always placeable. The success test is unchanged (within 3 cm of the
#      disc's centre for 1 s).
#   v3 (2026-10-15): the experiments-with-consequences sources (scripted programs with outcomes), and the
#      held-out few-shot tasks T1-T4 (stack, drawer-open, push-to-target, turn-reach) with BiGym's
#      StackBlocks and DrawerTopOpen. Written before any experiment episode exists. The programs and
#      props of held-out sources must not appear in pretraining sources (checked on load). v2 does not
#      assign the new sources and no longer loads; it is kept for the record.
#   v2 (2026-10-14): `stand_supported` episodes are their own sources, humanoid/{hand,pincer}/stand_table,
#      instead of sharing "table" with the seated ones (decision 2 of the D0.3 step 3 review). Both
#      join the pretraining section; nothing is held out. There was no v1 file. v0 no longer loads
#      against configs/sources.toml (it does not assign the new sources) and is kept for the record.
#   v0: the first split (car, drone, piano, four humanoid sources).
#
# Every source in configs/sources.toml must be listed in exactly one section;
# sensorium.pool.load_splits checks this. Changing this file changes its hash,
# which every pool records.
version = "v3.3"

[pretrain]
sources = [
  "car/drive", "drone/waypoints", "piano/rp1m",
  "humanoid/hand/stand", "humanoid/hand/table", "humanoid/pincer/stand", "humanoid/pincer/table",
  "humanoid/hand/stand_table", "humanoid/pincer/stand_table",
  "humanoid/hand/exp_push",
  "humanoid/pincer/exp_push",
  "humanoid/hand/exp_topple",
  "humanoid/pincer/exp_topple",
  "humanoid/hand/exp_slide",
  "humanoid/pincer/exp_slide",
  "humanoid/hand/exp_press",
  "humanoid/pincer/exp_press",
  "humanoid/hand/exp_knock",
  "humanoid/pincer/exp_knock",
  "humanoid/hand/exp_door",
  "humanoid/pincer/exp_door",
  "humanoid/hand/exp_lift_drop",
  "humanoid/pincer/exp_lift_drop",
  "humanoid/hand/exp_turn",
  "humanoid/pincer/exp_turn",
]

# Held-out *tasks*: whole sources never seen in pretraining. T1-T4 of the experiments design (their
# scripted programs are the demonstrators) and BiGym's human demos of the same families. Each needs a
# reason and a tag, reported per side.
[heldout.tasks]
"humanoid/pincer/stack" = { reason = "T1: stack two blocks, pincer side", tag = "contact_rich" }
"humanoid/pincer/drawer_open" = { reason = "T2: open the drawer, pincer side", tag = "contact_rich" }
"humanoid/hand/push_to_target" = { reason = "T3: push a block onto a marked target", tag = "contact_rich" }
"humanoid/pincer/push_to_target" = { reason = "T3: push a block onto a marked target", tag = "contact_rich" }
"humanoid/pincer/place_on_target" = { reason = "T3b: pick T1's block and place it on a marked target (pincers)", tag = "contact_rich" }
"humanoid/hand/turn_reach" = { reason = "T4: reach the far-side object by turning the torso", tag = "contact_rich" }
"humanoid/pincer/turn_reach" = { reason = "T4: reach the far-side object by turning the torso", tag = "contact_rich" }
"bigym/pincer/stack_blocks" = { reason = "T1: stack two blocks, pincer side", tag = "contact_rich" }
"bigym/pincer/drawer_top_open" = { reason = "T2: open the drawer, pincer side", tag = "contact_rich" }

# Held-out *instances*: specific content within a task that otherwise stays in the
# pretraining pool (a song of the piano, a mocap clip of a walk, a demo of a BiGym
# task, an object layout of a play task). Keyed by task name (as in sources.toml),
# not by source; the task must be registered and must not itself be held out.
# None yet. TODO (D0.5): generate the RP1M entry from RP1M's own in-distribution /
# out-of-distribution song lists with a small script, as:
#
#   [heldout.instances.rp1m]
#   ids = ["song_0123", "song_0456"]
#   reason = "RP1M out-of-distribution songs, hand side"
#   tag = "contact_rich"
[heldout.instances]
