# E1 pilot pools (docs/experiment-01.md, docs/fewshot.md): the scripted experiment programs, the pilot's
# "expert" stand-in (supervisor decision 1b, 2026-11-05), generated at the same code version as
# configs/event_dense.toml so that H2's contrast of the two kinds does not cross generation runs.
# Programs only, with the settings and props of configs/variety.toml's program blocks. 30 blocks of 37
# seated episodes of 600 steps (1,110, as event_dense): hands 2 blocks per program (push, slide, press,
# knock, door, topple, lift_drop) and a third lift_drop, pincers knock 5, lift_drop 4, push 3, topple
# 3, so hand:pincer is 50:50 by steps (555 each). 1,110 covers the pool's 1,044 training episodes
# and its 5% held-out split (2 x 28), with a few to spare. The pincers' slide, press and door wait
# 72-79% of the time and are left out (docs/experiments.md, known gaps). No held-out program or prop
# (stack, drawer_open, push_to_target, place_on_target; stack_blocks, drawer, target_disc,
# place_block). A fresh master seed (7).
#
#   uv run sensorium-generate configs/e1_programs.toml
out_dir = "data/e1_programs"
master_seed = 7

[humanoid.hand_push_00]
policies = ["experiment"]
episodes_per_policy = 37
steps = 600
settings = { effector = "hand", posture = "seated", program = "push", props = [], hidden_properties = true, effort = true }

