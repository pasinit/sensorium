# The babbling set regenerated with the current hands (claw pinch, elliptic friction cones):
# configs/scale_test.toml's layout (15 hand and 15 pincer seated_babble blocks of 37, 600 steps),
# fresh master seed (5). The variety experiment's control set (configs/variety.toml): hidden object
# properties and effort on as there, so that both sets share the physics distribution and channels.
#
#   uv run sensorium-generate configs/babble_v2.toml
out_dir = "data/babble_v2"
master_seed = 5

[humanoid.hand_seated_00]
policies = ["seated_babble"]
episodes_per_policy = 37
steps = 600
settings = { effector = "hand", posture = "seated", hidden_properties = true, effort = true }

