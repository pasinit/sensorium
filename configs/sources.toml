# Experience-source registry. A source is one (body, effector, task) triple.
# Loaded and validated by src/sensorium/registry.py; see docs/pools.md for how
# to add one. Manifests carry body, policy, task, instance and (for bodies with
# end-effector variants) effector; [default_task] covers manifests that predate
# the task field.

# Recorded policy name -> kind of experience.
[policy_kinds]
expert = "expert"
noisy = "noisy"
explore = "babbling"
hold = "babbling"           # humanoid: stands with small arm noise, task-free
seated_babble = "babbling"  # humanoid: touch, poke, slide, grasp at a table, task-free
reach_free = "babbling"     # humanoid: whole-body free-space reaching (HumanoidBench policy)
experiment = "experiment"   # humanoid: a scripted experiment program with outcomes (its own stratum)

# Task assumed for manifest entries that have no "task" field.
[default_task]
car = "drive"
drone = "waypoints"
piano = "rp1m"

# effector: "hand" | "pincer" | "none" | "alien"
# tags: exactly one of "contact_rich" | "vision_dominated" (plus anything else)

[[source]]
name = "car/drive"
body = "car"
effector = "alien"
task = "drive"
family = "driving"
tags = ["vision_dominated"]

[[source]]
name = "drone/waypoints"
body = "drone"
effector = "alien"
task = "waypoints"
family = "flight"
tags = ["vision_dominated"]

[[source]]
name = "piano/rp1m"
body = "piano"
effector = "hand"
task = "rp1m"
family = "piano"
tags = ["contact_rich"]

