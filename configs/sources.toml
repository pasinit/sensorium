# Experiments with consequences (Track A, D0.3 step 5+): scripted experiment programs with outcomes
# (docs/experiments.md). One source per (effector, program); `programs` and `props` are what a split
# checks so that a held-out task's program and prop configuration never appear in pretraining.
# Humanoid sources record the program as their task. Posture is in each episode's meta.

[[source]]
name = "humanoid/hand/exp_push"
