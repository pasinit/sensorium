# Data for the episode-scaling check (Track B, docs/model.md): 1,110 seated babbling episodes of
# 600 steps, half Shadow hands, half Robotiq pincers, in 30 blocks of 37 (one process each, so a
# 32-vCPU machine runs them all at once). A fresh master seed: these episodes are disjoint from
# configs/probe_test.toml's and are not mixed with them (one generator commit for the whole set).
# The pretraining subsets (100 / 300 / 1,000) and the 100 held-out episodes are chosen by the
# training script, stratified by block.
#
#   uv run sensorium-generate configs/scale_test.toml    # ~4 h on 32 vCPUs (software rendering)
out_dir = "data/scale_test"
master_seed = 2

[humanoid.hand_seated_00]
policies = ["seated_babble"]
episodes_per_policy = 37
steps = 600
settings = { effector = "hand", posture = "seated" }

