# S2 batch, part 2: the variants the first run (configs/experiments_batch.toml) did not reach when it was
# stopped, plus the hands' door. Same settings; 12 episodes of 600 steps each. `workers` caps the processes.
out_dir = "data/experiments_batch2"
master_seed = 0
workers = 3

[humanoid.hand_knock]
policies = ["experiment"]
episodes_per_policy = 12
steps = 600
settings = { effector = "hand", posture = "seated", program = "knock", props = [], hidden_properties = true, effort = true }

[humanoid.pincer_knock]
policies = ["experiment"]
episodes_per_policy = 12
steps = 600
settings = { effector = "pincer", posture = "seated", program = "knock", props = [], hidden_properties = true, effort = true }

[humanoid.hand_door]
policies = ["experiment"]
episodes_per_policy = 12
steps = 600
settings = { effector = "hand", posture = "seated", program = "door", props = ["hinged_flap"], hidden_properties = true, effort = true }
