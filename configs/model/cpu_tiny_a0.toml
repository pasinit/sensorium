# The tiny CPU model with the plain JEPA objective ("A0": no reconstruction term), the recipe of
# every study before B-fix-0/B-fix-1 (cpu_tiny.toml's default is now JEPA + reconstruction in one
# masked pass). The historical study scripts load this file so their recipes stay unchanged.
# A tiny model for CPU smoke runs on the H1 sample (hands and pincers): ~1 minute for 300 steps.
# Run from the repo root with the sample at data/sample_h1 (make sample-h1), or symlink it.
name = "cpu-tiny"
seed = 0

[data]
paths = ["data/sample_h1/humanoid/*.npz"]

[model]
dim = 128
fusion_depth = 2
predictor_depth = 2
heads = 4
vision_size = 64
vision_patch = 8
vision_dim = 64
vision_depth = 2
vision_heads = 2
vision_tokens = 4
touch_dim = 64
touch_depth = 1
touch_heads = 2
touch_tokens = 3
steps = 8
substeps = 4
sigreg_proj = 256
sigreg_pool_time = true
recon_weight = 0.0  # batch 8 is too small for the per-step statistic (docs/model.md)

[train]
steps = 300
batch_size = 8
lr = 3e-4
log_every = 25
