# E1 pilot, Track B (docs/model.md, "E1 pilot, Track B: pre-registration"): arm all x babbling.
# v0 widths, A0 (no reconstruction), seed 0. The four pilot arms differ only in model.senses and in the
# pool (data.pool, data.heldout_paths); every other value, the step budget included, is identical.
# Step budget: 10 epochs of the babbling pool (e1/pools/e1-pilot-babble.json, content hash
# f65b5cfdd3b4dfa1: 1,044 episodes of 600 steps, 626,400 steps, 537 starts each for 64-step
# sequences = 560,628 starts): ceil(10 x 560,628 / 128) = 43,800, the same for all four arms (the
# expert stand-in pool is to match its 626,400 steps). Held-out split: the pool's 55 episodes
# (sensorium.pool.link_heldout -> data/pools/<pool>-heldout/). PLACEHOLDER: the expert pool's name.
name = "e1-pilot-all-babble"
seed = 0

[data]
pool = "data/pools/e1-pilot-babble.json"  # hash f65b5cfdd3b4dfa1
heldout_paths = ["data/pools/e1-pilot-babble-heldout/*.npz"]  # the pool's 55 held-out episodes

[augment]
crop = 0.9
frame_cache = "data/e1_cache160"  # 160 px cache of the pool's episodes (crop 0.9 -> 128 px)
cache_episodes = 32

[model]
senses = ["vision", "touch", "audio", "proprio_body", "vestibular", "proprio_effector"]
steps = 16
substeps = 4
vision_size = 128
sense_dropout = 0.0
recon_weight = 0.0  # A0, written out (the default since B-pusht-0)

[train]
steps = 43800  # 10 epochs of the 626,400-step pools, identical for the four arms
batch_size = 128
lr = 5e-5
weight_decay = 1e-3
warmup = 500
log_every = 100
save_every = 2000
save_steps = [0, 2000, 10000, 25000, 43800]
num_workers = 12
device = "cuda"
precision = "bf16"
eval_windows = 256
mean_stop = 0.8  # a predictor no better than the mean stops the arm (pred / std^2)
mean_stop_step = 2000
resume_every = 500
heldout_every = 2000
heldout_batches = 8
out_dir = "runs/e1_pilot"
