# The v0 sensory layer at full size (~40M parameters; see docs/model.md): for the GPU smoke
# test and the pilot, not for CPUs. Point data.pool at a pool built by sensorium-pool.
name = "v0"
seed = 0

[data]
pool = "data/pools/pilot.json"

[model]
steps = 16
substeps = 4
vision_size = 128
sense_dropout = 0.0

[train]
steps = 20000
batch_size = 128
lr = 5e-5
weight_decay = 1e-3
warmup = 500
log_every = 100
save_every = 2000
num_workers = 8
